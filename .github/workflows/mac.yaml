name: Mac

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    name: Cocoa
    runs-on: macos-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v6

      - name: Build
        run: |
          cd src
          env OPT="-Werror" make -f Makefile.osx -j$(sysctl -n hw.activecpu)
