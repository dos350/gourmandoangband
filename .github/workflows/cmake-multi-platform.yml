name: CMake with Clang on Windows

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci]'))
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Visual Studio developer environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Fetch vcpkg manifest baseline
      shell: pwsh
      run: |
        $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
        $baseline = $manifest.'builtin-baseline'
        git -C $env:VCPKG_INSTALLATION_ROOT fetch --no-tags --depth=1 origin $baseline
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Configure CMake (Windows x64)
      shell: pwsh
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_C_COMPILER=clang-cl
        -DCMAKE_RC_COMPILER=llvm-rc
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DVCPKG_TARGET_TRIPLET=x64-windows
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config Release
